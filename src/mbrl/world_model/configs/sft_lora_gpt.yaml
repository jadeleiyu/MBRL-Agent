# Model
model_name_or_path: openai/gpt-oss-20b
attn_implementation: eager
torch_dtype: bfloat16

# Dataset
dataset_name: jadeleiyu/WM-live-sft
ds_name_short: live
dataset_num_proc: 12

# Hyperparameters
learning_rate: 2.0e-4
gradient_checkpointing: true
num_train_epochs: 1.0
logging_steps: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
use_peft: true
lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
lora_target_modules: all-linear
max_length: 4096
warmup_ratio: 0.03
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
output_dir: /checkpoint/multimodal-reasoning/jadeleiyu/mbrl_agent/wm_sft/
seed: 42

# Extra
n_train_examples: -1



