hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

actor_rollout_ref:
  rollout:
    mode: async
    agent:
      num_workers: 0
    val_kwargs:
      do_sample: True

data:
  gen_batch_size: ${mul:${data.train_batch_size},${rllm.rejection_sample.multiplier}}

rllm:
  agent:
    name: math_agent
    max_steps: 20
    trajectory_timeout: null
    overlong_filter: False
    agent_args: {}
    engine_args:
      retry_limit: 100
  env:
    name: custom
    env_args: {}
  workflow:
    use_workflow: False
    name: single_turn_workflow
    workflow_args:
      agent_cls: null
      agent_args: {}
      env_cls: null
      env_args: {}
      timeout: 1e6
      gamma: 0.0
      reward_bonus_coeff: 0.0
    n_parallel_tasks: 256
    retry_limit: 100
  disable_thinking: False
  accumulate_reasoning: False
  mask_truncated_samples: False
  stepwise_advantage:
    enable: False
    mode: broadcast
    normalize_by_steps: False
  compact_filtering:
    enable: False
    mask_max_prompt_length_exceeded: True
    mask_max_response_length_exceeded: True
    mask_env_done: False
    mask_max_turns_exceeded: True
    mask_timeout: True
    mask_unknown: False
    mask_error: True
  rejection_sample:
    enable: False
    multiplier: 1
  standard_answer:
    inject_every_k: 0
    reward: 1.0
    seed: null

# DAPO-specific overrides
reward_model:
  reward_manager: dapo

algorithm:
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False
    metric: null  # acc / score / seq_reward / seq_final_reward / ...
    max_num_gen_batches: 0

trainer:
  project_name: rllm-agent-dapo

